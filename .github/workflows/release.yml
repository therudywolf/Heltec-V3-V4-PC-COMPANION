name: Release

# Per-product release tracks. Push a prefixed tag to release ONE product:
#   bmw-v0.5.0     -> Nocturne BMW
#   pc-v0.5.0      -> Nocturne PC
#   hacker-v0.5.0  -> Nocturne Hacker
#   multi-v0.5.0   -> Nocturne Multi (all-in-one)
# Builds that app, packages a flashable factory image + ESP Web Tools manifest
# (and the Android APK for BMW), and publishes a GitHub Release.

on:
  push:
    tags:
      - 'bmw-v*'
      - 'pc-v*'
      - 'hacker-v*'
      - 'multi-v*'

permissions:
  contents: write

jobs:
  firmware:
    name: Build & package firmware
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.id.outputs.app }}
      ver: ${{ steps.id.outputs.ver }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO and esptool
        run: pip install platformio "esptool~=4.8"

      - name: Identify product from tag
        id: id
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"          # e.g. pc-v0.5.0
          APP="${TAG%%-v*}"                 # pc
          VER="${TAG#${APP}-v}"             # 0.5.0
          echo "app=$APP" >> "$GITHUB_OUTPUT"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "Releasing app=$APP version=$VER"

      - name: Create secrets.h stub
        run: |
          cat > include/secrets.h << 'EOF'
          #ifndef NOCTURNE_SECRETS_H
          #define NOCTURNE_SECRETS_H
          #define WIFI_SSID "CHANGE_ME"
          #define WIFI_PASS "CHANGE_ME"
          #define PC_IP     "192.168.1.100"
          #define TCP_PORT  8090
          #endif
          EOF

      - name: Build apps/${{ steps.id.outputs.app }}
        run: pio run -d "apps/${{ steps.id.outputs.app }}"

      - name: Package factory image + manifest
        run: |
          set -euo pipefail
          APP="${{ steps.id.outputs.app }}"
          VER="${{ steps.id.outputs.ver }}"
          BUILD="apps/$APP/.pio/build/$APP"
          BOOT_APP0="$(find "$HOME/.platformio/packages" -name boot_app0.bin | head -n1)"
          mkdir -p dist

          # Plain application image (OTA / advanced).
          cp "$BUILD/firmware.bin" "dist/nocturne-$APP-$VER.bin"

          # Merged factory image flashed from offset 0 (what the web flasher writes).
          python -m esptool --chip esp32s3 merge_bin \
            -o "dist/nocturne-$APP-factory.bin" \
            --flash_mode qio --flash_freq 80m \
            0x0     "$BUILD/bootloader.bin" \
            0x8000  "$BUILD/partitions.bin" \
            0xe000  "$BOOT_APP0" \
            0x10000 "$BUILD/firmware.bin"

          cat > "dist/manifest-$APP.json" << EOF
          {
            "name": "Nocturne $APP",
            "version": "$VER",
            "new_install_prompt_erase": true,
            "builds": [
              {
                "chipFamily": "ESP32-S3",
                "parts": [
                  { "path": "https://github.com/${{ github.repository }}/releases/latest/download/nocturne-$APP-factory.bin", "offset": 0 }
                ]
              }
            ]
          }
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: dist/

  android:
    name: Companion APK (BMW only)
    needs: firmware
    if: needs.firmware.outputs.app == 'bmw'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build APK
        working-directory: apps/bmw/companion-app
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Collect APK
        run: |
          set -euo pipefail
          VER="${{ needs.firmware.outputs.ver }}"
          mkdir -p dist
          APK="$(find apps/bmw/companion-app -path '*release*' -name '*.apk' | head -n1)"
          cp "$APK" "dist/BMW-Assistant-$VER.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/

  release:
    name: Publish GitHub Release
    needs: [firmware, android]
    if: always() && needs.firmware.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -la release
      - uses: softprops/action-gh-release@v2
        with:
          name: Nocturne ${{ needs.firmware.outputs.app }} ${{ needs.firmware.outputs.ver }}
          files: release/*
          generate_release_notes: true
          prerelease: false
          fail_on_unmatched_files: false
