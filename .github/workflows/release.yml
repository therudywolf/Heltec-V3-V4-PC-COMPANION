name: Release

# Triggered by pushing a version tag (e.g. v0.4.0). Builds all three firmware
# profiles, packages flashable images + ESP Web Tools manifests, optionally
# builds the companion APK, and publishes a GitHub Release with the artifacts.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  firmware:
    name: Firmware (${{ matrix.env }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [bmw_only, pc_companion, full]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO and esptool
        run: pip install platformio "esptool~=4.8"

      - name: Create secrets.h stub
        run: |
          cat > include/secrets.h << 'EOF'
          #ifndef NOCTURNE_SECRETS_H
          #define NOCTURNE_SECRETS_H
          #define WIFI_SSID "CHANGE_ME"
          #define WIFI_PASS "CHANGE_ME"
          #define PC_IP     "192.168.1.100"
          #define TCP_PORT  8090
          #endif
          EOF

      - name: Build ${{ matrix.env }}
        run: pio run -e ${{ matrix.env }}

      - name: Package release artifacts
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          ENV="${{ matrix.env }}"
          BUILD=".pio/build/$ENV"
          BOOT_APP0="$(find "$HOME/.platformio/packages" -name boot_app0.bin | head -n1)"
          mkdir -p dist

          # Plain application image — for OTA / advanced users.
          cp "$BUILD/firmware.bin" "dist/nocturne-$ENV-$VER.bin"

          # Merged factory image — single file flashed from offset 0
          # (bootloader + partition table + otadata + app). Used by the web flasher.
          python -m esptool --chip esp32s3 merge_bin \
            -o "dist/nocturne-$ENV-factory.bin" \
            --flash_mode qio --flash_freq 80m \
            0x0     "$BUILD/bootloader.bin" \
            0x8000  "$BUILD/partitions.bin" \
            0xe000  "$BOOT_APP0" \
            0x10000 "$BUILD/firmware.bin"

          # ESP Web Tools manifest — points at the latest-release factory image.
          cat > "dist/manifest-$ENV.json" << EOF
          {
            "name": "Nocturne OS — $ENV",
            "version": "$VER",
            "new_install_prompt_erase": true,
            "builds": [
              {
                "chipFamily": "ESP32-S3",
                "parts": [
                  { "path": "https://github.com/${{ github.repository }}/releases/latest/download/nocturne-$ENV-factory.bin", "offset": 0 }
                ]
              }
            ]
          }
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.env }}
          path: dist/

  android:
    name: Companion APK
    runs-on: ubuntu-latest
    # Best-effort: a broken Android build must not block the firmware release.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Collect APK
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          APK="$(find app/android -path '*release*' -name '*.apk' | head -n1)"
          cp "$APK" "dist/BMW-Assistant-$VER.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: companion-apk
          path: dist/

  release:
    name: Publish GitHub Release
    needs: [firmware, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -la release

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: false
