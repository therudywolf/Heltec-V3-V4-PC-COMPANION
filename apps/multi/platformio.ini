; Nocturne Multi — the all-in-one personal build (Heltec WiFi LoRa 32 V4 / ESP32-S3).
;
; Part of the Nocturne OS monorepo. Shares the root src/ tree and the
; lib/nocturne-core library; compiles EVERYTHING: PC monitoring + Forza + BMW
; (incl. OBD2 diagnostics) + the WiFi/BLE research tools, in one firmware.
; The kitchen-sink build for enthusiasts; the 3 clean products stay lean.
;
; Build:  pio run -d apps/multi
; Upload: pio run -d apps/multi -t upload

[platformio]
default_envs = multi
src_dir     = ${PROJECT_DIR}/../../src
include_dir = ${PROJECT_DIR}/../../include
lib_dir     = ${PROJECT_DIR}/../../lib

[env:multi]
platform = espressif32 @ 6.5.0
board = heltec_wifi_lora_32_V3
framework = arduino

board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
; Heltec V4 has 16 MB flash (V3 board profile defaults to 8 MB). Use the full
; chip: dual 3 MB OTA app slots + ~10 MB LittleFS. First flash must be boot-
; confirmed on hardware. Revert: point partitions back at huge_app.csv + drop
; the two board_upload overrides.
board_build.partitions = ${PROJECT_DIR}/../../partitions_v4_16mb.csv
board_build.filesystem = littlefs
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

; Multi compiles everything EXCEPT the BMW assistant (#19 — BMW dropped from the
; all-in-one build). The BMW translation units are excluded here; the rest of
; modules/car (Forza) stays. NOCT_FEATURE_BMW=0 guards the BMW references out of
; the shared tree (main / AppModeManager / SceneManager / MenuHandler).
build_src_filter =
    +<*>
    -<modules/car/BmwManager.cpp>
    -<modules/car/ObdClient.cpp>
    -<modules/car/BleKeyService.cpp>
    -<modules/car/DemoManager.cpp>
    -<modules/car/ibus>
    -<modules/display/DisplayManager.cpp>

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; Debug over USB (no external probe): the ESP32-S3 exposes a built-in USB-JTAG.
;   GDB:    pio debug -d apps/multi        (uses debug_tool below)
;   Serial: pio device monitor -e multi    (115200, exception decoder)
debug_tool = esp-builtin
debug_speed = 40000

extra_scripts =
    pre:${PROJECT_DIR}/../../tools/version.py
    pre:${PROJECT_DIR}/../../tools/app_includes.py

lib_ldf_mode = deep+
lib_archive = no
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D NOCT_FEATURE_BMW=0
    -D NOCT_FEATURE_MONITORING=1
    -D NOCT_FEATURE_FORZA=1
    -D NOCT_FEATURE_HACKER=1
    -D NOCT_FEATURE_WOLFPET=1
    -D NOCT_FEATURE_LORA=1
    -D NOCT_FEATURE_LORA_TX=1
lib_deps =
    olikraus/U8g2 @ ^2.35.9
    h2zero/NimBLE-Arduino @ ^1.4.2
    bblanchon/ArduinoJson @ ^7.0.3
    jgromes/RadioLib @ ^6.6.0
