; Nocturne Hacker — standalone product build (Heltec WiFi LoRa 32 V4 / ESP32-S3).
;
; Part of the Nocturne OS monorepo. Shares the root src/ tree and the
; lib/nocturne-core library; compiles the full feature set INCLUDING the
; WiFi/BLE research tools (sniff/scan/probe/EAPOL, evil-twin honeypot, BLE
; scan/spam). Passive recon + capture + own-AP honeypot only — no deauth/jammer.
;
; Build:  pio run -d apps/hacker
; Upload: pio run -d apps/hacker -t upload

[platformio]
default_envs = hacker
src_dir     = ${PROJECT_DIR}/../../src
include_dir = ${PROJECT_DIR}/../../include
lib_dir     = ${PROJECT_DIR}/../../lib

[env:hacker]
platform = espressif32 @ 6.5.0
board = heltec_wifi_lora_32_V3
framework = arduino

board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
; Heltec V4 has 16 MB flash (V3 board profile defaults to 8 MB). Use the full
; chip: dual 3 MB OTA app slots + ~10 MB LittleFS. First flash must be boot-
; confirmed on hardware. Revert: point partitions back at huge_app.csv + drop
; the two board_upload overrides.
board_build.partitions = ${PROJECT_DIR}/../../partitions_v4_16mb.csv
board_build.filesystem = littlefs
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

; Hacker build compiles the whole tree (all modules).
build_src_filter = +<*>

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

extra_scripts =
    pre:${PROJECT_DIR}/../../tools/version.py
    pre:${PROJECT_DIR}/../../tools/app_includes.py

lib_ldf_mode = deep+
lib_archive = no
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D NOCT_FEATURE_BMW=1
    -D NOCT_FEATURE_MONITORING=1
    -D NOCT_FEATURE_FORZA=1
    -D NOCT_FEATURE_HACKER=1
    -D NOCT_FEATURE_LORA=1
lib_deps =
    olikraus/U8g2 @ ^2.35.9
    h2zero/NimBLE-Arduino @ ^1.4.2
    bblanchon/ArduinoJson @ ^7.0.3
    jgromes/RadioLib @ ^6.6.0
