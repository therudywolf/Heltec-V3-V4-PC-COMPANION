; Nocturne BMW — standalone product build (Heltec WiFi LoRa 32 V4 / ESP32-S3).
;
; Part of the Nocturne OS monorepo. Shares the root src/ tree and the
; lib/nocturne-core library; this project compiles ONLY the BMW path
; (E39 I-Bus assistant + BLE proximity key) — no WiFi / monitoring / hacker code.
;
; Build:  pio run -d apps/bmw
; Upload: pio run -d apps/bmw -t upload

[platformio]
default_envs = bmw
src_dir     = ${PROJECT_DIR}/../../src
include_dir = ${PROJECT_DIR}/../../include
lib_dir     = ${PROJECT_DIR}/../../lib

[env:bmw]
platform = espressif32 @ 6.5.0
board = heltec_wifi_lora_32_V3
framework = arduino

board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.partitions = ${PROJECT_DIR}/../../huge_app.csv
board_build.filesystem = littlefs

; Compile only the BMW path; exclude PC/monitoring and hacker modules entirely.
build_src_filter =
    +<*>
    -<modules/network>
    -<modules/ble>
    -<modules/car/ForzaManager.cpp>
    -<modules/car/ForzaManager.h>

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

extra_scripts = pre:${PROJECT_DIR}/../../tools/version.py

lib_ldf_mode = deep+
lib_archive = no
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D NOCT_FEATURE_BMW=1
    -D NOCT_FEATURE_MONITORING=0
    -D NOCT_FEATURE_FORZA=0
    -D NOCT_FEATURE_HACKER=0
    -I ${PROJECT_DIR}/../../src
    -I ${PROJECT_DIR}/../../src/modules
    -I ${PROJECT_DIR}/../../src/modules/display
    -I ${PROJECT_DIR}/../../src/modules/car
    -I ${PROJECT_DIR}/../../src/modules/car/ibus
lib_deps =
    olikraus/U8g2 @ ^2.35.9
    h2zero/NimBLE-Arduino @ ^1.4.2
